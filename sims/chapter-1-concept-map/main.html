<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
<title>Chapter 1 Concept Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
  #wrap { padding: 10px 14px; }
  h1 { text-align: center; font-size: 20px; margin: 4px 0 8px; }
  #network { width: 100%; height: 460px; border: 1px solid #ccc; border-radius: 6px; background: white; }
  #legend { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 8px 0; font-size: 12px; }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }
  #legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  #panel { min-height: 70px; border: 1px solid #ccc; border-radius: 6px; padding: 10px 14px; margin-top: 8px; background: #fafafa; }
  #panel h2 { margin: 0 0 4px; font-size: 16px; }
  #panel p { margin: 0; font-size: 14px; color: #333; }
</style>
</head>
<body>
<div id="wrap">
<h1>Chapter 1 Concept Map</h1>
<div id="legend">
  <span><i style="background:SteelBlue"></i>Sounds &amp; Mechanics</span>
  <span><i style="background:LimeGreen"></i>Vocabulary Strategy</span>
  <span><i style="background:Gold"></i>Communication</span>
  <span><i style="background:DarkGoldenrod"></i>Numbers &amp; Time</span>
  <span><i style="background:DarkSlateBlue"></i>Grammar Mechanics</span>
</div>
<div id="network"></div>
<div id="panel"><p style="color:#777">Click a concept node to see its definition and highlight its direct connections. Hover an edge to see the prerequisite relationship.</p></div>
</div>
<script>
const defs = {
  "Spanish Alphabet": "Spanish uses the same 26 letters as English, plus ñ.",
  "Vowel Sounds": "Each of the five Spanish vowels has exactly one consistent sound.",
  "Syllable Stress": "The emphasized syllable in a word, predicted by two simple rules based on the word's last letter.",
  "Written Accent Marks": "A mark placed over a vowel to signal that a word breaks the normal stress rule.",
  "Cognates": "Words that look similar and mean the same thing in English and Spanish.",
  "False Cognates": "Words that look like an English word but mean something different.",
  "Classroom Expressions": "Common phrases used to communicate about the class itself, like asking for repetition.",
  "Question Words": "The eight words (qué, quién, cuándo...) used to start most questions.",
  "Asking Questions": "Forming questions in Spanish, marked with ¿ at the start and ? at the end.",
  "Numbers 0-30": "The individual and compressed number words from zero through treinta.",
  "Numbers 31-100": "Numbers formed by joining tens and ones with y, e.g. treinta y uno.",
  "Days Of The Week": "Lunes through domingo -- not capitalized in Spanish.",
  "Months Of The Year": "Enero through diciembre -- not capitalized in Spanish.",
  "Telling Time": "Using Son las / Es la with y, menos, media, and cuarto to state the time.",
  "Subject Pronouns": "The words (yo, tú, usted...) that tell who is doing an action.",
  "Gender Of Nouns": "Every Spanish noun is grammatically masculine or feminine.",
  "Plural Of Nouns": "Adding -s or -es to a noun depending on whether it ends in a vowel or consonant.",
  "Capitalization Rules": "Spanish does not capitalize days, months, or (later) nationalities/languages.",
};

const groupColors = {
  sound: "SteelBlue", vocab: "LimeGreen", comm: "Gold", numtime: "DarkGoldenrod", gram: "DarkSlateBlue",
};

const nodeGroup = {
  "Spanish Alphabet": "sound", "Vowel Sounds": "sound", "Syllable Stress": "sound",
  "Written Accent Marks": "sound", "Capitalization Rules": "sound",
  "Cognates": "vocab", "False Cognates": "vocab",
  "Classroom Expressions": "comm", "Question Words": "comm", "Asking Questions": "comm",
  "Numbers 0-30": "numtime", "Numbers 31-100": "numtime", "Days Of The Week": "numtime",
  "Months Of The Year": "numtime", "Telling Time": "numtime",
  "Subject Pronouns": "gram", "Gender Of Nouns": "gram", "Plural Of Nouns": "gram",
};

const nodesData = Object.keys(defs).map((label, i) => ({
  id: i + 1, label: label,
  color: { background: groupColors[nodeGroup[label]], border: "#333" },
  font: { color: (nodeGroup[label] === "vocab" || nodeGroup[label] === "comm") ? "black" : "white", size: 13 },
  shape: "box", margin: 8,
}));

const idByLabel = {};
nodesData.forEach(n => idByLabel[n.label] = n.id);

// edges point FROM dependent TO prerequisite (dependency direction)
const edgeDefs = [
  ["Vowel Sounds", "Spanish Alphabet"],
  ["Syllable Stress", "Spanish Alphabet"],
  ["Syllable Stress", "Vowel Sounds"],
  ["Written Accent Marks", "Syllable Stress"],
  ["False Cognates", "Cognates"],
  ["Asking Questions", "Question Words"],
  ["Numbers 31-100", "Numbers 0-30"],
  ["Telling Time", "Numbers 0-30"],
  ["Telling Time", "Days Of The Week"],
  ["Telling Time", "Months Of The Year"],
  ["Plural Of Nouns", "Gender Of Nouns"],
  ["Capitalization Rules", "Spanish Alphabet"],
];

const edgesData = edgeDefs.map(([from, to]) => ({
  from: idByLabel[from], to: idByLabel[to], arrows: "to",
  color: { color: "#999", highlight: "#c62828" },
  title: from + " is needed before it can build on " + to,
}));

const container = document.getElementById("network");
const data = { nodes: new vis.DataSet(nodesData), edges: new vis.DataSet(edgesData) };
const options = {
  physics: { stabilization: true, barnesHut: { gravitationalConstant: -6000, springLength: 110 } },
  interaction: { hover: true, tooltipDelay: 100 },
  layout: { improvedLayout: true },
};
const network = new vis.Network(container, data, options);

network.on("click", function (params) {
  const panel = document.getElementById("panel");
  if (params.nodes.length > 0) {
    const node = nodesData.find(n => n.id === params.nodes[0]);
    panel.innerHTML = "<h2>" + node.label + "</h2><p>" + (defs[node.label] || "") + "</p>";
    const connected = network.getConnectedNodes(node.id);
    network.setSelection({ nodes: [node.id, ...connected], edges: network.getConnectedEdges(node.id) });
  } else {
    panel.innerHTML = "<p style='color:#777'>Click a concept node to see its definition and highlight its direct connections.</p>";
    network.unselectAll();
  }
});
</script>
</body>
</html>
