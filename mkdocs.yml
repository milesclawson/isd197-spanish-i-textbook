# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'ISD 197 Spanish Program'
site_description: 'ACTFL-aligned Spanish courses for ISD 197 -- Spanish I (high school, Entreculturas) and Spanish 1A/1B (middle school, Ven Conmigo) -- with cultural comparisons across the Spanish-speaking world and local Minnesota communities.'
site_author: 'Miles Lawson'
site_url: 'https://milesclawson.github.io/isd197-spanish-i-textbook/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/milesclawson/isd197-spanish-i-textbook'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Miles Lawson. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - "1. Foundations: Building Blocks of Spanish": chapters/01-foundations-building-blocks/index.md
      - "2. Meeting People: Greetings and Introductions": chapters/02-meeting-people-greetings/index.md
      - "3. Sharing Interests and Comparing Cultures: Paraguay and Texas": chapters/03-sharing-interests-paraguay-texas/index.md
      - "4. School Life, Schedules and Everyday Articles": chapters/04-school-life-schedules-articles/index.md
      - "5. Comparing Education: Costa Rica and California": chapters/05-comparing-education-costa-rica-california/index.md
      - "6. Family, Description and the Verb Estar": chapters/06-family-description-estar/index.md
      - "7. Home, Weekend Plans and Comparing Families: Spain and Colorado": chapters/07-home-weekend-plans-spain-colorado/index.md
      - "8. Food, Market and Stem-Changing Verbs": chapters/08-food-market-stem-changing-verbs/index.md
      - "9. Menus, Traditions and Comparing Food Cultures: Mexico and North Carolina": chapters/09-menus-traditions-mexico-north-carolina/index.md
      - "10. Communicating Like a Spanish Speaker: The ACTFL Framework": chapters/10-communicating-actfl-framework/index.md
      - "11. Practice Modalities and Assessment": chapters/11-practice-modalities-assessment/index.md
      - "12. Capstone Presentations, Digital Tools and Study Strategies": chapters/12-capstone-presentations-digital-tools/index.md
      - "13. Reflecting Across Cultures and Looking Ahead to Spanish II": chapters/13-reflecting-cultures-looking-ahead/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
      - List of MicroSims: sims/index.md

  - Spanish 1A:
      - Course Description: spanish-1a/index.md
      - "Unit 1: Content": spanish-1a/unit-1/index.md
      - "Unit 1: Story": spanish-1a/unit-1/story.md
      - "Unit 1: Daily Rhythm": spanish-1a/unit-1/daily-rhythm.md

  - Spanish 1B:
      - Course Description: spanish-1b/index.md
      - "Unit 1: Content": spanish-1b/unit-1/index.md
      - "Unit 1: Story": spanish-1b/unit-1/story.md
      - "Unit 1: Daily Rhythm": spanish-1b/unit-1/daily-rhythm.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'red'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md
  **/index-template.md
  **/logs/*.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'ISD 197 Spanish Program'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
